name: Build APK
run-name: "🔨 Сборка APK YevGallery"

on:
  push:
    branches: [main]
    paths:                            # собирать только когда меняется сам проект,
      - 'Project_YevGallery.zip'      # а не README и прочая мелочь в репозитории
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать архив проекта в корень
        run: |
          set -e
          if [ ! -f Project_YevGallery.zip ]; then
            echo "::error::Нет Project_YevGallery.zip в корне репозитория."; exit 1
          fi
          unzip -o -q Project_YevGallery.zip -d _extracted
          if [ -d _extracted/Project_YevGallery ]; then SRC=_extracted/Project_YevGallery; else SRC=_extracted; fi
          shopt -s dotglob
          for item in "$SRC"/*; do
            name=$(basename "$item")
            [ "$name" = ".github" ] && continue     # workflow из репозитория архивом не перетираем
            rm -rf "./$name"
            cp -r "$item" "./$name"
          done
          shopt -u dotglob
          rm -rf _extracted
          rm -f Project_YevGallery.zip
          echo "=== корень после распаковки ===" && ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"                 # работает благодаря package-lock.json в архиве

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci || npm install     # ci — быстрее и детерминированнее; install — запасной путь

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: |
          rm -rf android            # снести любую закоммиченную/старую платформу — иначе cap add пропустит свежую сборку
          rm -f capacitor.config.ts # в архиве только JSON-конфиг; свежий CLI спотыкается на разборе .ts
          npx cap add android
          npx cap copy android      # принудительно скопировать свежий web-бандл (dist) в ассеты
          # тюнинг Gradle: параллельность + build cache (быстрее компиляция)
          {
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.configureondemand=true"
            echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8"
          } >> android/gradle.properties
          # версия APK берётся из package.json: 1.001 -> versionName "1.001", versionCode 1001
          VER=$(node -p "require('./package.json').version")
          VCODE=$(node -p "String(Math.round(parseFloat(require('./package.json').version) * 1000))")
          sed -i "s/versionCode [0-9][0-9]*/versionCode $VCODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          echo "версия APK: $VER ($VCODE)"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Generate app icons
        run: |
          # Рендерим icon.svg в icon.png через sharp, затем @capacitor/assets
          if [ -f resources/icon.svg ]; then
            npm i -g sharp-cli >/dev/null 2>&1 || npm i sharp >/dev/null 2>&1 || true
            node -e "const s=require('sharp');s('resources/icon.svg',{density:300}).resize(1024,1024).png().toFile('resources/icon.png').then(()=>console.log('svg->png ok')).catch(e=>{console.log('render skip:',e.message)})" || echo "sharp render skipped, using existing icon.png"
          fi
          npx @capacitor/assets generate --android --assetPath resources

      - name: Add Android permissions
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q "MANAGE_EXTERNAL_STORAGE" "$MAN"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.SET_WALLPAPER" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\n    <application#' "$MAN"
          fi
          # доступ к файлам в legacy-режиме (Android 10)
          sed -i 's#<application #<application android:requestLegacyExternalStorage="true" #' "$MAN"
          # старый back-callback, чтобы кнопка/жест «Назад» доходили до приложения
          sed -i 's#<application #<application android:enableOnBackInvokedCallback="false" #' "$MAN"
          # FileProvider — для «обои/поделиться/изменить»
          # регистрируем приложение как источник выбора медиа (файл-пикер фото/видео)
          python3 - "$MAN" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          # singleTask ломает startActivityForResult: вызывающее приложение сразу получает "отменено"
          s = s.replace('android:launchMode="singleTask"', 'android:launchMode="singleTop"')
          FILTERS = """
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="content" android:mimeType="image/*" />
                <data android:scheme="content" android:mimeType="video/*" />
                <data android:scheme="file" android:mimeType="image/*" />
                <data android:scheme="file" android:mimeType="video/*" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.GET_CONTENT" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.OPENABLE" />
                <data android:mimeType="image/*" />
                <data android:mimeType="video/*" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.PICK" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="image/*" />
                <data android:mimeType="video/*" />
                <data android:mimeType="vnd.android.cursor.dir/image" />
                <data android:mimeType="vnd.android.cursor.dir/video" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.PICK" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:scheme="content" android:mimeType="image/*" />
                <data android:scheme="content" android:mimeType="video/*" />
                <data android:scheme="content" android:mimeType="vnd.android.cursor.dir/image" />
                <data android:scheme="content" android:mimeType="vnd.android.cursor.dir/video" />
            </intent-filter>
          """
          if "GET_CONTENT" not in s:
              s = s.replace("</activity>", FILTERS + "</activity>", 1)
          PROVIDER = """    <provider android:name="leshugan.yg.YevDocumentsProvider" android:authorities="${applicationId}.documents" android:exported="true" android:grantUriPermissions="true" android:permission="android.permission.MANAGE_DOCUMENTS"><intent-filter><action android:name="android.content.action.DOCUMENTS_PROVIDER" /></intent-filter></provider>
          """
          if "YevDocumentsProvider" not in s:
              s = s.replace("</application>", PROVIDER + "</application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("манифест: фильтры пикера добавлены, launchMode =", "singleTop" if "singleTop" in s else "?")
          PYEOF
          if ! grep -q "appsfp" "$MAN"; then
            sed -i 's#</application>#    <provider android:name="leshugan.yg.AppsFileProvider" android:authorities="${applicationId}.appsfp" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/apps_file_paths" /></provider>\n    </application>#' "$MAN"
          fi
          echo "----- manifest -----"
          grep -E "uses-permission|requestLegacy|appsfp" "$MAN" || true

      - name: Install native Apps plugin
        run: |
          PKG=android/app/src/main/java/leshugan/yg
          mkdir -p "$PKG" android/app/src/main/res/xml
          cp native/AppsPlugin.java "$PKG/AppsPlugin.java"
          cp native/MainActivity.java "$PKG/MainActivity.java"
          cp native/AppsFileProvider.java "$PKG/AppsFileProvider.java"
          cp native/YevDocumentsProvider.java "$PKG/YevDocumentsProvider.java"
          cp native/apps_file_paths.xml android/app/src/main/res/xml/apps_file_paths.xml
          echo "native files:" && ls -la "$PKG"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --build-cache \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/uc.jks" \
            -Pandroid.injected.signing.store.password="updatechecker" \
            -Pandroid.injected.signing.key.alias="uc" \
            -Pandroid.injected.signing.key.password="updatechecker"

      - name: Переименовать APK по версии
        id: rename_apk
        run: |
          set -e
          VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "dev")
          DIR=android/app/build/outputs/apk/release
          SRC=$(ls "$DIR"/*.apk | head -1)
          OUT="$DIR/YevGallery_$VER.apk"
          mv "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # archive: false — качается сразу APK, без обёртки в zip (имя артефакта = имя файла)
          archive: false
          path: ${{ steps.rename_apk.outputs.apk }}
          retention-days: 5

  cleanup:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old runs and APKs (keep last 10 successful)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          WF=build.yml
          echo "Оставляем 10 последних успешных запусков:"
          KEEP=$(gh run list --repo "$REPO" --workflow "$WF" --status success --limit 10 --json databaseId --jq '.[].databaseId')
          echo "$KEEP"
          echo "Удаляем остальные запуски и их APK:"
          gh run list --repo "$REPO" --workflow "$WF" --limit 300 --json databaseId --jq '.[].databaseId' | while read -r id; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if ! printf '%s\n' "$KEEP" | grep -qx "$id"; then
              gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 && echo "удалён $id" || true
            fi
          done
